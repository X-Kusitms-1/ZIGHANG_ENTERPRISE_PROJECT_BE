name: PR Test
permissions:
  contents: read    # checkout, 빌드 스크립트 읽기 권한
  checks: write     # Test Results 액션이 check-run 생성/수정 권한
  issues: write     # 이슈에 코멘트 작성 권한
  pull-requests: write  # PR에 코멘트 작성 권한

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Create application-stage.properties
        run: |
          echo "${{ secrets.APPLICATION_STAGE_PROPERTIES }}" > ./src/main/resources/application-stage.properties
          echo "${{ secrets.APPLICATION_TEST_PROPERTIES }}" > ./src/test/resources/application-test.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test with Gradle
        run: ./gradlew --info test

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ always() }}
        with:
          files: build/test-results/**/*.xml